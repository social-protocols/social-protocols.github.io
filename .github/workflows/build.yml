name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# Main runs share deploy-production, and a newer main run cancels an older
# one so the latest main wins. Every other ref, PRs and manual runs on
# other branches included, gets its own ci-<ref> group and can't touch a
# main deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-production' || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive 

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.131.0'
          extended: true

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Build
        run: just check

      - name: Deploy to Github Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: public # The folder the action should deploy.
          clean-exclude: ".nojekyll"
