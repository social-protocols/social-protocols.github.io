name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

# Production deploys (push to main, workflow_dispatch) share deploy-production
# and queue (cancel-in-progress: false) so an in-progress deploy is not cancelled.
# PR CI uses a per-PR group so it cannot cancel a main deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive 

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.131.0'
          extended: true

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Build
        run: just check

      - name: Deploy to Github Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.2.5
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: public # The folder the action should deploy.
          clean-exclude: ".nojekyll"
